<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>D&D Map Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="toolbar">
            <button onclick="setTool('floor')">Floor</button>
            <button onclick="setTool('wall')">Wall</button>
            <button onclick="openCharacterSheet()">Create Character</button>
        </div>

        <div id="map"></div>

        <div id="character-list">
            <h3>Characters</h3>
        </div>
    </div>

    <!-- Character Creation Modal -->
    <div id="charSheet" class="modal">
        <div class="modal-content" dir="ltr">
            <h2>Create Character</h2>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="charName">
            </div>
            <div class="form-group">
                <label>Color:</label>
                <input type="color" id="charColor" value="#ff0000">
            </div>
            <!-- Creation Steps Container -->
            <div id="creation-steps"></div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="statsSheet" class="stats-modal">
        <div class="stats-content">
            <h2>Character Stats</h2>
            <div id="charInfo"></div>
            <div class="stats-grid">
                <div class="stat-box">
                    <label>Strength</label>
                    <input type="number" id="str" min="1" max="20" value="10">
                    <div id="strMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Dexterity</label>
                    <input type="number" id="dex" min="1" max="20" value="10">
                    <div id="dexMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Constitution</label>
                    <input type="number" id="con" min="1" max="20" value="10">
                    <div id="conMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Intelligence</label>
                    <input type="number" id="int" min="1" max="20" value="10">
                    <div id="intMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Wisdom</label>
                    <input type="number" id="wis" min="1" max="20" value="10">
                    <div id="wisMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Charisma</label>
                    <input type="number" id="cha" min="1" max="20" value="10">
                    <div id="chaMod">+0</div>
                </div>
            </div>
            <button onclick="saveStats()">Save Stats</button>
            <button onclick="closeModal('statsSheet')">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!-- Add this inside the toolbar div -->
<div id="toolbar">
    <button onclick="setTool('floor')">Floor</button>
    <button onclick="setTool('wall')">Wall</button>
    <button onclick="openCharacterSheet()">Create Character</button>
    <button onclick="saveCampaign()">Save Campaign</button>
</div>

<!-- Add this new modal for campaign saving -->
<div id="campaignSaveModal" class="modal">
    <div class="modal-content" dir="ltr">
        <h2>Save Campaign</h2>
        <div class="form-group">
            <label>Campaign Name:</label>
            <input type="text" id="campaignName" placeholder="Enter campaign name">
        </div>
        <div class="button-group">
            <button onclick="finalizeCampaignSave()">Save</button>
            <button onclick="closeModal('campaignSaveModal')">Cancel</button>
        </div>
    </div>
</div>
