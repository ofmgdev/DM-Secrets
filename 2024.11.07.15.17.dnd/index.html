<!DOCTYPE html>
<html>
<head>
    <title>D&D Map Creator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: repeating-linear-gradient(
                45deg,
                #8b4513,
                #8b4513 10px,
                #a0522d 10px,
                #a0522d 20px
            );
            margin: 0;
            padding: 20px;
        }

        #container {
            background: #654321;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            border: 3px solid #4a3219;
        }

        #toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #map {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 1px;
            background: #333;
            padding: 10px;
            border: 8px solid #4a3219;
            border-radius: 5px;
        }

        .tile {
            width: 30px;
            height: 30px;
            background: white;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        button {
            padding: 8px 15px;
            background: #8b4513;
            color: white;
            border: 2px solid #4a3219;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #a0522d;
        }

        #character-list {
            background: #4a3219;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }

        .character-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #654321;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }

        .button-group {
            display: flex;
            gap: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #654321;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            color: white;
            border: 3px solid #4a3219;
        }

        /* Stats Modal Specific Styles */
        .stats-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .stats-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #654321;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            color: white;
            border: 3px solid #4a3219;
            max-height: 90vh;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat-box {
            text-align: center;
            background: #8b4513;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #4a3219;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="toolbar">
            <button onclick="setTool('floor')">Floor</button>
            <button onclick="setTool('wall')">Wall</button>
            <button onclick="openCharacterSheet()">Create Character</button>
        </div>

        <div id="map"></div>

        <div id="character-list">
            <h3>Characters</h3>
        </div>
    </div>

    <!-- Character Creation Modal -->
    <div id="charSheet" class="modal">
        <div class="modal-content">
            <h2>Create Character</h2>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="charName">
            </div>
            <div class="form-group">
                <label>Class:</label>
                <select id="charClass">
                    <option value="fighter">Fighter</option>
                    <option value="wizard">Wizard</option>
                    <option value="rogue">Rogue</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color:</label>
                <input type="color" id="charColor" value="#ff0000">
            </div>
            <button onclick="saveCharacter()">Save</button>
            <button onclick="closeModal('charSheet')">Close</button>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="statsSheet" class="stats-modal">
        <div class="stats-content">
            <h2>Character Stats</h2>
            <div id="charInfo"></div>
            <div class="stats-grid">
                <div class="stat-box">
                    <label>Strength</label>
                    <input type="number" id="str" min="1" max="20" value="10">
                    <div id="strMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Dexterity</label>
                    <input type="number" id="dex" min="1" max="20" value="10">
                    <div id="dexMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Constitution</label>
                    <input type="number" id="con" min="1" max="20" value="10">
                    <div id="conMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Intelligence</label>
                    <input type="number" id="int" min="1" max="20" value="10">
                    <div id="intMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Wisdom</label>
                    <input type="number" id="wis" min="1" max="20" value="10">
                    <div id="wisMod">+0</div>
                </div>
                <div class="stat-box">
                    <label>Charisma</label>
                    <input type="number" id="cha" min="1" max="20" value="10">
                    <div id="chaMod">+0</div>
                </div>
            </div>
            <button onclick="saveStats()">Save Stats</button>
            <button onclick="closeModal('statsSheet')">Close</button>
        </div>
    </div>

    <script>
        let currentTool = 'floor';
        let characters = [];
        let selectedCharacter = null;
        let currentCharacterId = null;

        // Initialize map
        document.addEventListener('DOMContentLoaded', function() {
            const map = document.getElementById('map');
            for (let i = 0; i < 300; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.onclick = handleTileClick;
                map.appendChild(tile);
            }

            // Add ability score change listeners
            ['str', 'dex', 'con', 'int', 'wis', 'cha'].forEach(ability => {
                document.getElementById(ability).addEventListener('change', () => {
                    updateModifier(ability);
                });
            });
        });

        function setTool(tool) {
            currentTool = tool;
            selectedCharacter = null;
        }

        function handleTileClick(e) {
            if (selectedCharacter) {
                placeCharacter(e.target);
            } else {
                e.target.style.background = currentTool === 'floor' ? 'white' : '#666';
            }
        }

        function openCharacterSheet() {
            document.getElementById('charSheet').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function saveCharacter() {
            const name = document.getElementById('charName').value;
            if (!name) {
                alert('Please enter a character name');
                return;
            }

            const character = {
                id: Date.now(),
                name: name,
                class: document.getElementById('charClass').value,
                color: document.getElementById('charColor').value,
                stats: {
                    str: 10,
                    dex: 10,
                    con: 10,
                    int: 10,
                    wis: 10,
                    cha: 10
                }
            };

            characters.push(character);
            updateCharacterList();
            closeModal('charSheet');
            document.getElementById('charName').value = '';
        }

        function updateCharacterList() {
            const list = document.getElementById('character-list');
            list.innerHTML = '<h3>Characters</h3>';
            characters.forEach(char => {
                const div = document.createElement('div');
                div.className = 'character-item';
                div.innerHTML = `
                    <span>${char.name} (${char.class})</span>
                    <div class="button-group">
                        <button onclick="openStats(${char.id})">Stats</button>
                        <button onclick="selectCharacter(${char.id})">Place</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function selectCharacter(id) {
            selectedCharacter = characters.find(c => c.id === id);
        }

        function placeCharacter(tile) {
            if (!selectedCharacter) return;
            const charDiv = document.createElement('div');
            charDiv.style.width = '80%';
            charDiv.style.height = '80%';
            charDiv.style.backgroundColor = selectedCharacter.color;
            charDiv.style.margin = 'auto';
            charDiv.style.borderRadius = '50%';
            tile.innerHTML = '';
            tile.appendChild(charDiv);
            selectedCharacter = null;
        }

        function openStats(id) {
            currentCharacterId = id;
            const character = characters.find(c => c.id === id);
            if (character && character.stats) {
                document.getElementById('charInfo').innerHTML = `
                    <h3>${character.name}</h3>
                    <p>Class: ${character.class}</p>
                `;
                
                // Load stats
                Object.keys(character.stats).forEach(stat => {
                    document.getElementById(stat).value = character.stats[stat];
                    updateModifier(stat);
                });
            }
            document.getElementById('statsSheet').style.display = 'block';
        }

        function updateModifier(ability) {
            const score = document.getElementById(ability).value;
            const mod = Math.floor((parseInt(score) - 10) / 2);
            document.getElementById(`${ability}Mod`).textContent = 
                (mod >= 0 ? '+' : '') + mod;
        }

        function saveStats() {
            const character = characters.find(c => c.id === currentCharacterId);
            if (character) {
                character.stats = {
                    str: document.getElementById('str').value,
                    dex: document.getElementById('dex').value,
                    con: document.getElementById('con').value,
                    int: document.getElementById('int').value,
                    wis: document.getElementById('wis').value,
                    cha: document.getElementById('cha').value
                };
                closeModal('statsSheet');
                updateCharacterList();
            }
        }
    </script>
</body>
</html>
